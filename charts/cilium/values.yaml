cilium:
  # Talos owns the pod CIDRs; do not use Cilium cluster-pool IPAM.
  ipam:
    mode: kubernetes
  kubeProxyReplacement: true
  k8sServiceHost: 192.168.0.11
  k8sServicePort: 6443
  socketLB:
    hostNamespaceOnly: true
  # Talos already mounts cgroupv2 and bpffs on the host.
  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup
  bpf:
    autoMount:
      enabled: false
  # Talos removes SYS_MODULE from the workload capability bounding set.
  # Keep Cilium's least-privilege mode, but omit that unavailable capability.
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE