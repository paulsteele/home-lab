baseResources:
  clusterIssuer:
    secretName: cloudflare-api-token
  certificates:
  - name: paul-steele.com
    namespace: default
    domains:
    - '*.paul-steele.com'
  # Kubernetes TLS Secrets are namespace-scoped. Argo's Ingress lives in ci,
  # so it needs its own copy of the wildcard certificate.
  - name: paul-steele.com
    namespace: ci
    domains:
    - '*.paul-steele.com'
  - name: paul-steele.com
    namespace: deployments
    domains:
    - '*.paul-steele.com'
