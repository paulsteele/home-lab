{{- define "base.daemonset" -}}
{{- $daemonset := .Values.baseResources.daemonset -}}
apiVersion: apps/v1
kind: DaemonSet
{{ include "base.metadata" . }}
spec:
  selector:
    matchLabels:
      {{- if $daemonset.recommendedSelectorLabels }}
      {{- include "base.recommendedSelectorLabels" . | nindent 6 }}
      {{- else if $daemonset.selectorLabels }}
      {{- toYaml $daemonset.selectorLabels | nindent 6 }}
      {{- else }}
      app: {{ include "base.name" . }}
      {{- end }}
  {{- with $daemonset.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "base.labels" . | nindent 8 }}
        {{- with $daemonset.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or $daemonset.podAnnotations $daemonset.configMapChecksum $daemonset.configMapChecksums }}
      annotations:
        {{- with $daemonset.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $daemonset.configMapChecksum }}
        checksum/configmaps: {{ include "base.configmaps" . | sha256sum }}
        {{- end }}
        {{- range $name, $template := $daemonset.configMapChecksums }}
        checksum/{{ $name }}: {{ include (print $.Template.BasePath $template) $ | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
    {{- $data := dict "root" . "resource" $daemonset "volumes" .Values.baseResources.volumes -}}
    {{- include "base.deploymentSpec" $data | nindent 6 }}
{{- end -}}
