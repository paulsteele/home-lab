{{- define "base.deploymentSpec" -}}
{{- $resource := get . "resource" -}}
{{- $volumes := default (list) (get . "volumes") -}}
{{- $volumeDict := dict -}}
{{- range $volume := $volumes -}}
{{- $_ := set $volumeDict $volume.name $volume -}}
{{- end -}}
{{- with $resource.podSpec }}
{{ toYaml . }}
{{- end }}
{{- if hasKey $resource "hostNetwork" }}
hostNetwork: {{ $resource.hostNetwork }}
{{- end }}
{{- with $resource.dnsPolicy }}
dnsPolicy: {{ . }}
{{- end }}
{{- with $resource.imagePullSecrets }}
imagePullSecrets:
{{ toYaml . | nindent 2 }}
{{- end }}
{{- with $resource.securityContext }}
securityContext:
{{ toYaml . | nindent 2 }}
{{- end }}
{{- with $resource.nodeSelector }}
nodeSelector:
{{ toYaml . | nindent 2 }}
{{- end }}
{{- with $resource.tolerations }}
tolerations:
{{ toYaml . | nindent 2 }}
{{- end }}
containers:
{{- range $container := $resource.containers }}
- image: {{ $container.image }}
  name: {{ $container.name }}
  {{- with $container.imagePullPolicy }}
  imagePullPolicy: {{ . }}
  {{- end }}
  {{- with $container.command }}
  command:
{{ toYaml . | nindent 2 }}
  {{- end }}
  {{- with $container.args }}
  args:
{{ toYaml . | nindent 2 }}
  {{- end }}
  {{- with $container.envs }}
  env:
  {{- range $env := . }}
  - name: {{ $env.name }}
    {{- if hasKey $env "value" }}
    value: {{ $env.value | quote }}
    {{- else if $env.valueFrom }}
    valueFrom:
{{ toYaml $env.valueFrom | nindent 6 }}
    {{- else if $env.secretName }}
    valueFrom:
      secretKeyRef:
        name: {{ $env.secretName }}
        key: {{ $env.secretKey }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- with $container.ports }}
  {{- $ports := list -}}
  {{- range $port := . -}}
    {{- if kindIs "map" $port -}}
      {{- $ports = append $ports $port -}}
    {{- else -}}
      {{- $ports = append $ports (dict "containerPort" $port) -}}
    {{- end -}}
  {{- end }}
  ports:
{{ toYaml $ports | nindent 2 }}
  {{- end }}
  {{- with $container.securityContext }}
  {{- $securityContext := deepCopy . -}}
  {{- if and (hasKey $securityContext "capabilities") (kindIs "slice" $securityContext.capabilities) -}}
    {{- $_ := set $securityContext "capabilities" (dict "add" $securityContext.capabilities) -}}
  {{- end }}
  securityContext:
{{ toYaml $securityContext | nindent 4 }}
  {{- end }}
  {{- with $container.resources }}
  resources:
{{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with $container.lifecycle }}
  lifecycle:
{{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with $container.volumeMounts }}
  {{- $mounts := list -}}
  {{- range $mount := . -}}
    {{- $mountName := $mount -}}
    {{- if kindIs "map" $mount -}}
      {{- $mountName = $mount.name -}}
    {{- end -}}
    {{- $volume := get $volumeDict $mountName -}}
    {{- $mountSpec := dict "name" $mountName "mountPath" $volume.mountPath -}}
    {{- with $volume.subPath -}}
      {{- $_ := set $mountSpec "subPath" . -}}
    {{- end -}}
    {{- if hasKey $volume "readOnly" -}}
      {{- $_ := set $mountSpec "readOnly" $volume.readOnly -}}
    {{- end -}}
    {{- if kindIs "map" $mount -}}
      {{- $mountSpec = mergeOverwrite $mountSpec (deepCopy $mount) -}}
    {{- end -}}
    {{- $mounts = append $mounts $mountSpec -}}
  {{- end }}
  volumeMounts:
{{ toYaml $mounts | nindent 2 }}
  {{- end }}
{{- end }}
{{- if $volumes }}
{{- $renderedVolumes := list -}}
{{- range $volume := $volumes -}}
  {{- $found := false -}}
  {{- range $container := $resource.containers -}}
    {{- range $mount := default (list) $container.volumeMounts -}}
      {{- $mountName := $mount -}}
      {{- if kindIs "map" $mount -}}
        {{- $mountName = $mount.name -}}
      {{- end -}}
      {{- if eq $mountName $volume.name -}}
        {{- $found = true -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{- if $found -}}
    {{- $volumeSpec := dict "name" $volume.name -}}
    {{- if $volume.source.nfs -}}
      {{- $nfs := dict "server" (default "192.168.0.101" $volume.source.nfsServer) -}}
      {{- if kindIs "map" $volume.source.nfs -}}
        {{- $nfs = mergeOverwrite $nfs (deepCopy $volume.source.nfs) -}}
      {{- else -}}
        {{- $_ := set $nfs "path" $volume.source.nfs -}}
      {{- end -}}
      {{- $_ := set $volumeSpec "nfs" $nfs -}}
    {{- else if $volume.source.hostPath -}}
      {{- $hostPath := $volume.source.hostPath -}}
      {{- if not (kindIs "map" $hostPath) -}}
        {{- $hostPath = dict "path" $hostPath -}}
      {{- end -}}
      {{- $_ := set $volumeSpec "hostPath" $hostPath -}}
    {{- else if $volume.source.configmap -}}
      {{- $configMap := deepCopy $volume.source.configmap -}}
      {{- if and $configMap.items (kindIs "map" $configMap.items) -}}
        {{- $_ := set $configMap "items" (list $configMap.items) -}}
      {{- end -}}
      {{- $_ := set $volumeSpec "configMap" $configMap -}}
    {{- else if $volume.source.secret -}}
      {{- $secret := deepCopy $volume.source.secret -}}
      {{- $_ := set $secret "secretName" (default $secret.name $secret.secretName) -}}
      {{- $_ := unset $secret "name" -}}
      {{- if and $secret.items (kindIs "map" $secret.items) -}}
        {{- $_ := set $secret "items" (list $secret.items) -}}
      {{- end -}}
      {{- $_ := set $volumeSpec "secret" $secret -}}
    {{- else if $volume.source -}}
      {{- $volumeSpec = mergeOverwrite $volumeSpec (deepCopy $volume.source) -}}
    {{- end -}}
    {{- $renderedVolumes = append $renderedVolumes $volumeSpec -}}
  {{- end -}}
{{- end }}
volumes:
{{ toYaml $renderedVolumes | nindent 2 }}
{{- end }}
{{- end -}}
