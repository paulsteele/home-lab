baseResources:
  name: peer-relay

  services:
    - name: peer-relay
      type: LoadBalancer
      loadBalancerIP: 192.168.0.203
      ports:
        - name: relay
          port: 40000
          targetPort: 40000
          protocol: UDP

  deployment:
    omitMetadataLabels: true
    omitPodName: true
    securityContext:
      sysctls:
        - name: net.ipv4.ip_forward
          value: "1"
        - name: net.ipv6.conf.all.forwarding
          value: "1"
        - name: net.ipv6.conf.default.forwarding
          value: "1"
    containers:
      - name: tailscale
        image: tailscale/tailscale:v1.96.5
        securityContext:
          capabilities:
            - NET_ADMIN
            - NET_RAW
        envs:
          - name: TS_KUBE_SECRET
            value: ""
          - name: TS_USERSPACE
            value: "false"
          - name: TS_HOSTNAME
            value: peer-relay
          - name: TS_ACCEPT_DNS
            value: "false"
          - name: TS_EXTRA_ARGS
            value: --advertise-tags=tag:peer-relay --advertise-exit-node
          - name: OAUTH_SECRET
            secretName: operator-oauth
            secretKey: client_secret
          - name: TS_AUTHKEY
            value: $(OAUTH_SECRET)?ephemeral=true&preauthorized=true
          - name: RELAY_PORT
            value: "40000"
          - name: RELAY_LAN_IP
            value: 192.168.0.203
          - name: RELAY_IP_ECHO
            value: https://api.ipify.org
        ports:
          - name: relay
            containerPort: 40000
            protocol: UDP
        volumeMounts:
          - dev-net-tun
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  # Forwarding is configured by Talos on the node. Kubernetes
                  # mounts /proc/sys read-only here, so setting it in postStart
                  # cannot work reliably.
                  for i in $(seq 1 120); do
                    if tailscale status --json 2>/dev/null | grep -qE '"BackendState":[[:space:]]*"Running"'; then
                      break
                    fi
                    sleep 2
                  done
                  ENDPOINTS="${RELAY_LAN_IP}:${RELAY_PORT}"
                  if [ -n "$RELAY_IP_ECHO" ]; then
                    PUBLIC_IP=$(wget -qO- --timeout=5 "$RELAY_IP_ECHO" 2>/dev/null | tr -d '[:space:]')
                    if [ -n "$PUBLIC_IP" ]; then
                      ENDPOINTS="${ENDPOINTS},${PUBLIC_IP}:${RELAY_PORT}"
                    fi
                  fi
                  tailscale set \
                    --relay-server-port="${RELAY_PORT}" \
                    --relay-server-static-endpoints="${ENDPOINTS}"

  volumes:
    - name: dev-net-tun
      mountPath: /dev/net/tun
      source:
        hostPath:
          path: /dev/net/tun
          type: CharDevice
