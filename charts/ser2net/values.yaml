# Stock Alpine; the startup script installs ser2net from Alpine's package
# repository before discovering the host's USB serial devices.
image:
  repository: alpine
  tag: "3.22"
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The current single control plane owns the physical serial adapters. Use the
# standard hostname label so this remains a node-configured, not custom,
# scheduling label.
nodeSelector:
  kubernetes.io/hostname: azure

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: homelab.paul-steele.com/control-plane
    operator: Equal
    value: reserved
    effect: NoSchedule

service:
  type: ClusterIP
  ports:
    - name: zwave
      port: 3333
      targetPort: 3333
      protocol: TCP
    - name: zigbee
      port: 3334
      targetPort: 3334
      protocol: TCP

# Match the USB interface number as well as vendor/product: the HUSBZB-1
# exposes two serial interfaces with the same USB IDs. Do not use ttyUSB
# numbers here: those can change across reboots and node replacement.
serialMappings:
  - name: zwave
    vendorId: "10c4"
    productId: "8a2a"
    interface: "00"
    port: 3333
    serialOptions: 115200n81,local=true,nobreak=true
  - name: zigbee
    vendorId: "10c4"
    productId: "8a2a"
    interface: "01"
    port: 3334
    serialOptions: 57600n81,xonxoff=true,local=true,nobreak=true
