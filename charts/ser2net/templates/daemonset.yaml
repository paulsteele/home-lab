apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ser2net.name" . }}
  labels:
    {{- include "ser2net.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ser2net.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "ser2net.labels" . | nindent 8 }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: ser2net
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - /usr/local/libexec/ser2net/entrypoint.sh
          securityContext:
            privileged: true
          volumeMounts:
            - name: scripts
              mountPath: /usr/local/libexec/ser2net
              readOnly: true
            - name: host-dev
              mountPath: /dev
            - name: host-sys
              mountPath: /sys
              readOnly: true
            - name: snippets
              mountPath: /etc/ser2net/snippets
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: scripts
          configMap:
            name: {{ include "ser2net.name" . }}-scripts
            defaultMode: 0555
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: snippets
          configMap:
            name: {{ include "ser2net.name" . }}-snippets
            defaultMode: 0444
