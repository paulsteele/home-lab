apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ser2net.name" . }}-snippets
  labels:
    {{- include "ser2net.labels" . | nindent 4 }}
data:
  # The key includes the USB interface because the HUSBZB-1 exposes two
  # serial endpoints with the same vendor/product IDs.
  {{- if not .Values.serialMappings }}
  _README: No USB serial mappings configured yet.
  {{- end }}
  {{- range .Values.serialMappings }}
  {{- if and .vendorId .productId }}
  {{- if .interface }}
  {{ printf "%s-%s-if%s.yaml" .vendorId .productId .interface | quote }}: |-
  {{- else }}
  {{ printf "%s-%s.yaml" .vendorId .productId | quote }}: |-
  {{- end }}
    connection: &{{ .name }}
      accepter: tcp,{{ .port }}
      enable: on
      connector: serialdev,DEVNODE,{{ default "115200n81,local,nobreak" .serialOptions }}
      options:
        kickolduser: true
  {{- end }}
  {{- end }}
