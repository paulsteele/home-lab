repositories:
- name: stable
  url: https://charts.helm.sh/stable
- name: jetstack
  url: https://charts.jetstack.io
- name: argo
  url: https://argoproj.github.io/argo-helm
- name: itzg
  url: https://itzg.github.io/minecraft-server-charts
- name: nfs-subdir-external-provisioner
  url: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
- name: codecentrc
  url: https://codecentric.github.io/helm-charts
- name: metallb
  url: https://metallb.github.io/metallb
- name: twuni
  url: https://twuni.github.io/docker-registry.helm
- name: zabbix-community
  url: https://zabbix-community.github.io/helm-zabbix
- name: cilium
  url: https://helm.cilium.io/
- name: tailscale
  url: https://pkgs.tailscale.com/helmcharts
- name: traefik
  url: https://traefik.github.io/charts
- name: external-dns
  url: https://kubernetes-sigs.github.io/external-dns/
- name: strrl.dev 
  url: https://helm.strrl.dev
- name: blakeblackshear
  url: https://blakeblackshear.github.io/blakeshome-charts/

# A first-run diff must also work before CRD-providing releases have been applied.
helmDefaults:
  diffArgs:
    - --disable-validation
    # Never print decrypted Secret values in routine local or CI diffs.
    - --suppress-secrets
    # Ignore YAML formatting and key-order changes from shared base templates.
    - --normalize-manifests

releases:
- name: privileged-config
  namespace: default
  chart: ./charts/privileged-namespace
- name: automation
  namespace: default
  chart: ./charts/nodered
- name: books
  namespace: default
  chart: ./charts/calibre
- name: audiobooks
  namespace: default
  chart: ./charts/audiobookshelf
- name: pufferpanel
  namespace: default
  chart: ./charts/pufferpanel
- name: ci
  namespace: ci
  chart: ./charts/argo
  needs:
    - default/certmanager-config
  secrets:
    - ./charts/argo/secrets.yaml
  values:
    - ./charts/argo/rbac.yaml
- name: ci-workflows
  namespace: ci
  chart: ./charts/argo-workflows
  needs:
    - ci
  secrets:
    - ./charts/argo-workflows/secrets.yaml
- name: dav
  namespace: default
  chart: ./charts/baikal
- name: containers
  namespace: default
  chart: ./charts/docker-registry
- name: database
  namespace: default
  chart: ./charts/database
  secrets:
  - ./charts/database/secrets.yaml
- name: home
  namespace: default
  chart: ./charts/homeassistant
- name: loadbalancer
  namespace: privileged
  chart: ./charts/metallb
  needs:
    - default/privileged-config
- name: loadbalancer-config
  namespace: privileged
  chart: ./charts/metallb-configuration
  needs:
    - default/privileged-config
    - privileged/loadbalancer
- name: gonic
  namespace: default
  chart: ./charts/gonic
- name: passwords
  namespace: default
  chart: ./charts/bitwarden
- name: reader
  namespace: default
  chart: ./charts/freshrss
- name: oidc
  namespace: default
  chart: ./charts/keycloak
  secrets:
    - ./charts/keycloak/secrets.yaml
- name: storage
  namespace: default
  chart: ./charts/nfs-client-provisioner
- name: cilium
  namespace: kube-system
  chart: ./charts/cilium
- name: ser2net
  namespace: privileged
  chart: ./charts/ser2net
  needs:
    - default/privileged-config
- name: external-dns
  namespace: default
  chart: ./charts/external-dns
  secrets:
    - ./charts/external-dns/secrets.yaml
- name: certmanager
  namespace: default
  chart: ./charts/certmanager
- name: certmanager-config
  namespace: default
  chart: ./charts/certmanager-config
  needs:
    - certmanager
- name: tailscale-operator
  namespace: tailscale
  chart: ./charts/tailscale-operator
  needs:
    - default/privileged-config
  secrets:
    - ./charts/tailscale-operator/secrets.yaml
- name: tailscale-config
  namespace: tailscale
  chart: ./charts/tailscale-config
  needs:
    - tailscale-operator
- name: tailscale-peer-relay
  namespace: tailscale
  chart: ./charts/tailscale-peer-relay
  needs:
    - default/privileged-config
- name: traefik
  namespace: default
  chart: ./charts/traefik
- name: frigate
  namespace: privileged
  chart: ./charts/frigate
  needs:
    - default/privileged-config
  secrets:
    - ./charts/frigate/secrets.yaml
- name: mosquitto
  namespace: default
  chart: ./charts/mosquitto
  secrets:
    - ./charts/mosquitto/secrets.yaml
- name: external-proxy
  namespace: default
  chart: ./charts/external-proxy
- name: deployments
  namespace: deployments
  chart: ./charts/deployments
  secrets:
  - ./charts/deployments/secrets.yaml
- name: webfinger
  namespace: default
  chart: ./charts/webfinger
- name: video
  namespace: default
  chart: ./charts/jellyfin
- name: cloudflare-tunnel
  namespace: default
  chart: ./charts/cloudflare-tunnel
  secrets:
    - ./charts/cloudflare-tunnel/secrets.yaml
